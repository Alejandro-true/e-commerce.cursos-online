services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalogo_db
      POSTGRES_USER: microservicios
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microservicios -d catalogo_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  database-init:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: microservicios
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - ./infra/postgres/provision-databases.sh:/scripts/provision-databases.sh:ro
      - ./community-service/db/comunidad.sql:/seed/comunidad.sql:ro
    entrypoint: ["/bin/sh", "/scripts/provision-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  catalog-seed:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: microservicios
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - ./infra/postgres/seed-catalog.sh:/scripts/seed-catalog.sh:ro
      - ./catalog-service/src/main/resources/db/migration/demo_catalogo.sql:/seed/demo_catalogo.sql:ro
    entrypoint: ["/bin/sh", "/scripts/seed-catalog.sh"]
    depends_on:
      database-init:
        condition: service_completed_successfully
      catalog-service:
        condition: service_started

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog-service:
    build: ./catalog-service
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: catalogo_db
      DB_USER: microservicios
      DB_PASSWORD: local-development-only
      SERVICE_API_KEY: ${SERVICE_API_KEY:-local-development-service-key-change-this-32chars}
      DEMO_API_KEY: ${DEMO_API_KEY:-local-development-demo-key-change-this-32chars}
      DEMO_WEBHOOK_SECRET: ${DEMO_WEBHOOK_SECRET:-local-development-webhook-key-change-this-32chars}
      DEMO_VIDEO_SECRET: ${DEMO_VIDEO_SECRET:-local-development-video-secret-change-this-32chars}
      VIDEO_STORAGE_DIR: /var/lib/aulabreve/videos
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      FRONTEND_BASE_URL: http://localhost:4200
    volumes:
      - catalog_videos:/var/lib/aulabreve/videos
    ports:
      - "8080:8080"
    depends_on:
      database-init:
        condition: service_completed_successfully

  progress-service:
    build: ./progress-service
    environment:
      PORT: 3000
      NODE_ENV: development
      AUTH_MODE: development
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      MONGODB_URI: mongodb://mongodb:27017/progresoDB
      CATALOGO_SERVICE_URL: http://catalog-service:8080
      CATALOGO_ACCESS_PATH: /api/internal/progreso/cursos/{idCurso}/acceso/{idUsuario}
      CATALOGO_STRUCTURE_PATH: /api/internal/progreso/cursos/{idCurso}/versiones/{versionCurso}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-local-development-service-key-change-this-32chars}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: aulabreve.domain.events
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started

  community-service:
    build: ./community-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: comunidad_db
      DB_USER: microservicios
      DB_PASSWORD: local-development-only
      AUTH_MODE: development
      CATALOG_SERVICE_URL: http://catalog-service:8080
      SERVICE_API_KEY: ${SERVICE_API_KEY:-local-development-service-key-change-this-32chars}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: aulabreve.domain.events
      RABBITMQ_QUEUE: community.modulo-completado
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    ports:
      - "8000:8000"
    depends_on:
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started

  frontend-service:
    build: ./frontend-service
    ports:
      - "4200:80"
    depends_on:
      catalog-seed:
        condition: service_completed_successfully
      progress-service:
        condition: service_started
      community-service:
        condition: service_started

volumes:
  catalog_videos:
  postgres_data:
  mongodb_data:
