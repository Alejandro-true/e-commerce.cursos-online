<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crear cuenta | AulaBreve</title><link rel="stylesheet" href="/css/aula-cuenta.css"></head>
<body>
<header><a href="/demo/aula/catalogo" class="marca">Aula<span>Breve</span></a><a href="/demo/aula/catalogo">Ver catálogo público</a></header>
<main><section class="tarjeta">
<h1>Crear cuenta</h1><p>Regístrate para comprar cursos y acceder a ellos más adelante.</p>
<div class="aviso error" th:if="${error}" th:text="${error}" role="alert"></div>
<form th:action="@{/registro}" method="post">
<label for="nombre">Nombre completo</label><input id="nombre" name="nombre" autocomplete="name" maxlength="120" minlength="2" required th:value="${nombre}">
<label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" maxlength="255" required th:value="${email}">
<label for="password">Contraseña (mínimo 10 caracteres)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
<label for="confirmacion">Confirmar contraseña</label><input id="confirmacion" name="confirmacion" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
<button type="submit">Crear mi cuenta</button>
</form>
<p class="pie">¿Ya tienes cuenta? <a href="/ingresar">Iniciar sesión</a></p>
</section></main>
<footer>Ambiente DEMO local. Las cuentas se almacenan en PostgreSQL.</footer>
</body></html>
