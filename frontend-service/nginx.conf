server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/demo/auth/ {
        proxy_pass http://catalog-service:8080/api/demo/auth/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/cuenta/ {
        proxy_pass http://catalog-service:8080/api/demo/cuenta/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/demo/video/ {
        proxy_pass http://catalog-service:8080/api/demo/video/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/catalogo/ {
        proxy_pass http://catalog-service:8080/api/demo/portal/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/progreso/ {
        proxy_pass http://progress-service:3000/progreso/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Student-Id $http_x_student_id;
        proxy_set_header Idempotency-Key $http_idempotency_key;
    }

    location /api/comunidad/ {
        proxy_pass http://community-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Student-Id $http_x_student_id;
        proxy_set_header X-Admin-Id $http_x_admin_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
