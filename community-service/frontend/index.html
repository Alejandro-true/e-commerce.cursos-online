<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1e6359">
  <meta name="description" content="Tu espacio para compartir experiencias, celebrar tus avances y aprender en comunidad. AulaBreve Comunidad.">
  <title>Comunidad · AulaBreve</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <script type="module" src="./assets/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Ir al contenido</a>
  <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
    <a class="brand" href="#resumen" aria-label="AulaBreve, inicio"><span class="brand-mark">a<span></span></span><span>AulaBreve<span class="brand-sub">COMUNIDAD</span></span></a>
    <div class="workspace-label">TU ESPACIO DE APRENDIZAJE</div>
    <nav id="nav"></nav>
    <div id="sidebar-goal"></div>
    <div class="sidebar-bottom">
      <button class="nav-link" data-action="navigate" data-view="conexion"><span data-icon="settings"></span><span>Conexión</span><span class="status-dot"></span></button>
      <div class="sidebar-signature"><span class="tiny-spark">✧</span> Pequeños pasos. Grandes logros.</div>
    </div>
  </aside>
  <div class="app-body">
    <header class="topbar">
      <div class="topbar-left"><button class="icon-button mobile-menu" data-action="menu" aria-label="Abrir navegación"><span data-icon="menu"></span></button><span class="breadcrumb">Mi espacio <span>/</span> <strong id="breadcrumb-current">Resumen</strong></span></div>
      <div class="topbar-actions">
        <button class="mode-indicator" id="mode-indicator" data-action="navigate" data-view="conexion"></button>
        <button class="icon-button notification-button" data-action="navigate" data-view="actividad" aria-label="Ver actividad reciente"><span data-icon="bell"></span><span class="notification-dot"></span></button>
        <div class="topbar-divider"></div>
        <button class="profile-button" data-action="profile" aria-label="Cambiar vista de estudiante o administrador"><span class="avatar avatar-self">K</span><span class="profile-text"><strong id="profile-name">Klissman</strong><span id="profile-role">Vista de estudiante</span></span><span data-icon="chevron-down"></span></button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="app-footer"><span>AulaBreve Comunidad</span><span>Hecho para seguir aprendiendo, juntos.</span><span id="footer-mode"></span></footer>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
