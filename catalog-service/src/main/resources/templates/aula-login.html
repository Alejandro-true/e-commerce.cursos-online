<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión | AulaBreve</title><link rel="stylesheet" href="/css/aula-cuenta.css"></head>
<body>
<header><a href="/demo/aula/catalogo" class="marca">Aula<span>Breve</span></a><a href="/demo/aula/catalogo">Ver catálogo público</a></header>
<main><section class="tarjeta">
<h1>Iniciar sesión</h1><p>Utiliza el correo y la contraseña con los que te registraste.</p>
<div class="aviso exito" th:if="${param.registro}" role="status">Cuenta creada. Ahora puedes ingresar.</div>
<div class="aviso error" th:if="${param.error}" role="alert">Correo o contraseña incorrectos.</div>
<div class="aviso" th:if="${param.salir}" role="status">La sesión se ha cerrado.</div>
<form th:action="@{/ingresar}" method="post">
<label for="username">Correo electrónico</label><input id="username" name="username" type="email" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Ingresar</button>
</form>
<p class="pie">¿No tienes cuenta? <a href="/registro">Crear cuenta</a></p>
</section></main>
<footer>Ambiente DEMO local. Nunca compartas tu contraseña.</footer>
</body></html>
