<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AulaBreve | Checkout de demostracion</title>
<style>
body{font:16px system-ui,sans-serif;background:#f5f7fb;color:#13233c;padding:32px}
main{max-width:480px;margin:5vh auto;background:white;padding:30px;border-radius:14px;box-shadow:0 8px 32px #14253e16}
h1{font-size:25px}p{line-height:1.5}input{box-sizing:border-box;width:100%;padding:11px;margin:10px 0 18px}
button{border:0;padding:13px 16px;border-radius:7px;cursor:pointer;background:#185da5;color:white;margin:3px}
button.warn{background:#a34141}button.refund{background:#575c70}#resultado{white-space:pre-wrap;background:#eef2f7;padding:15px;border-radius:8px;margin-top:16px}
small{color:#5d6980}
</style>
</head>
<body>
<main th:attr="data-compra=${compra.compraId}">
<h1>Checkout AulaBreve <small>DEMO</small></h1>
<p><b>Curso:</b> <span th:text="${compra.titulo}"></span></p>
<p><b>Total:</b> <span th:text="${compra.moneda}"></span> <span th:text="${compra.monto}"></span></p>
<p><b>Estado actual:</b> <span th:text="${compra.estado}"></span></p>
<p><small>Sin transaccion real. Introduce la clave local de demostracion, nunca una contrasena real.</small></p>
<label for="clave">Clave DEMO</label>
<input type="password" id="clave" autocomplete="off" placeholder="DEMO_API_KEY de tu archivo .env"/>
<div>
<button onclick="simular('APROBADO')">Aprobar pago</button>
<button onclick="simular('RECHAZADO')" class="warn">Rechazar</button>
<button onclick="simular('REEMBOLSADO')" class="refund">Reembolsar</button>
</div>
<div id="resultado" role="status">Elige un escenario para continuar.</div>
</main>
<script>
async function simular(resultado){
 const compra=document.querySelector('main').dataset.compra;
 const clave=document.getElementById('clave').value;
 const box=document.getElementById('resultado');
 try{
  const r=await fetch('/api/demo/compras/'+encodeURIComponent(compra)+'/simular?resultado='+resultado,
   {method:'POST',headers:{'X-Demo-Key':clave}});
  const datos=await r.json();
  box.textContent=JSON.stringify(datos,null,2);
  if(r.ok){document.querySelector('p:nth-of-type(3) span').textContent=datos.estadoCompra;}
 }catch(e){box.textContent='No se pudo contactar con CatalogoService';}
}
</script>
</body>
</html>
