spring.application.name=catalogo-service
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Cargar las variables locales cuando existe un archivo .env con formato properties.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalogo_db}
spring.datasource.username=${DB_USER:catalogo_user}
spring.datasource.password=${DB_PASSWORD:catalogo_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

management.endpoints.web.exposure.include=health,info
spring.devtools.restart.enabled=true

app.integration.service-key=${SERVICE_API_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}
